services:
  # ─── PostgreSQL 16 + PostGIS + pgvector ────────────────────────
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: vancity_postgis
    environment:
      POSTGRES_DB: vancity_lens
      POSTGRES_USER: vancity
      POSTGRES_PASSWORD: vancity_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vancity -d vancity_lens"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ─── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vancity_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ─── PgBouncer Connection Pooling Proxy (VCL-91 / PERF-014) ────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vancity_pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U vancity"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  # ─── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vancity_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: "postgresql://vancity:vancity_dev@pgbouncer:6432/vancity_lens"
      REDIS_URL: "redis://redis:6379/0"
      # Optional (chat runs in DEMO mode without keys)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      COHERE_API_KEY: "${COHERE_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      JWT_SECRET: "${JWT_SECRET:-vcl-dev-jwt-secret-do-not-use-in-production-abc123}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-vcl-admin-dev-key-2026}"
      RATE_LIMIT_GENERAL: "${RATE_LIMIT_GENERAL:-1000}"
      RATE_LIMIT_LLM: "${RATE_LIMIT_LLM:-30}"
      SCRAPER_SCHEDULER_ENABLED: "${SCRAPER_SCHEDULER_ENABLED:-true}"
      # RAG backend selection (local vs K2)
      RAG_BACKEND: "${RAG_BACKEND:-local}"
      K2_API_HOST: "${K2_API_HOST:-}"
      K2_API_KEY: "${K2_API_KEY:-}"
      K2_CORPUS_ID: "${K2_CORPUS_ID:-}"
      K2_TOP_K: "${K2_TOP_K:-10}"
      K2_TIMEOUT_SECONDS: "${K2_TIMEOUT_SECONDS:-20}"
      K2_FALLBACK_TO_LOCAL: "${K2_FALLBACK_TO_LOCAL:-true}"
      # Used by /api/v1/geocode + /api/v1/reverse-geocode (falls back to NEXT_PUBLIC_MAPBOX_TOKEN)
      MAPBOX_TOKEN: "${MAPBOX_TOKEN:-${NEXT_PUBLIC_MAPBOX_TOKEN:-}}"
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./db:/app/db
      - ./pipeline:/app/pipeline
      - ./sdk:/app/sdk
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ─── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vancity_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      # Prefer NEXT_PUBLIC_MAPBOX_TOKEN (matches frontend/.env.local + .env.example),
      # but keep MAPBOX_TOKEN as a backwards-compatible fallback.
      NEXT_PUBLIC_MAPBOX_TOKEN: "${NEXT_PUBLIC_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ─── E2E Test Runner (on-demand) ───────────────────────────────
  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: vancity_e2e
    environment:
      PLAYWRIGHT_BASE_URL: "http://frontend:3000"
      API_BASE_URL: "http://api:8000"
    depends_on:
      - frontend
      - api
    profiles:
      - test
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

volumes:
  pgdata:
  redisdata:
