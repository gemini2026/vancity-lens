version: 2
updates:
  # Python dependencies via pip
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "bill47"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps):"
      include: scope
    pull-request-branch-name:
      separator: "/"

  # Node.js dependencies via npm (frontend)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "bill47"
    labels:
      - dependencies
      - javascript
      - frontend
    commit-message:
      prefix: "chore(deps):"
      include: scope
    pull-request-branch-name:
      separator: "/"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "bill47"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci:"
      include: scope
    pull-request-branch-name:
      separator: "/"
