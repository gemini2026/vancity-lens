name: Seed Data

on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        description: Data source to seed
        options:
          - all
          - council
          - rezoning
          - dpb
          - news
        default: all
      days_back:
        type: number
        description: Number of days back to seed
        default: 180

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run seed data script
        run: |
          POD_NAME=$(kubectl get pods -l app=vancity-lens-api -o jsonpath='{.items[0].metadata.name}')
          kubectl exec ${POD_NAME} -- python scripts/seed_data.py \
            --source ${{ github.event.inputs.source }} \
            --days-back ${{ github.event.inputs.days_back }}

      - name: Log seed completion
        if: success()
        run: |
          echo "Successfully seeded data from ${{ github.event.inputs.source }}"
          echo "Days back: ${{ github.event.inputs.days_back }}"
