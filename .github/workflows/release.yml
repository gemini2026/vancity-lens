name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image-tag=ghcr.io/${{ github.repository }}:${VERSION}" >> $GITHUB_OUTPUT
          echo "image-latest=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image-tag }}
            ${{ steps.meta.outputs.image-latest }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image-latest }}
          cache-to: type=inline

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          release_name: Release v${{ steps.meta.outputs.version }}
          body: |
            ## Docker Image
            - `${{ steps.meta.outputs.image-tag }}`
            - `${{ steps.meta.outputs.image-latest }}`

            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
