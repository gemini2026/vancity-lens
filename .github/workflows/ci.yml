name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vancity_lens
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check api/

      - name: Run ruff format check
        run: ruff format --check api/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vancity_lens
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-py${{ matrix.python-version }}-
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          python -c "
          import sys
          import time
          import subprocess

          # Install psycopg2 for reliable connection testing
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', 'psycopg2-binary'], check=True)

          import psycopg2

          conn_string = 'postgresql://postgres:postgres@localhost:5432/vancity_lens'

          for i in range(60):
              try:
                  conn = psycopg2.connect(conn_string)
                  conn.close()
                  print(f'PostgreSQL is ready (attempt {i+1})')
                  sys.exit(0)
              except psycopg2.OperationalError as e:
                  print(f'Attempt {i+1}/60: {e}')
                  time.sleep(2)
              except Exception as e:
                  print(f'Unexpected error on attempt {i+1}/60: {type(e).__name__}: {e}')
                  time.sleep(2)

          print('PostgreSQL did not become ready in time')
          sys.exit(1)
          "

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vancity_lens
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          python -m pytest tests/ -v --tb=short \
            --junitxml=junit-py${{ matrix.python-version }}.xml \
            --cov=api \
            --cov-report=term \
            --cov-report=html:coverage-report-py${{ matrix.python-version }} \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit-py${{ matrix.python-version }}.xml
            coverage-py${{ matrix.python-version }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage-report-py${{ matrix.python-version }}/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: 'junit-py${{ matrix.python-version }}.xml'
          reporter: 'java-junit'
          fail-on-error: false

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy

      - name: Run mypy type checking
        run: mypy api/ --ignore-missing-imports
        continue-on-error: true

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-
            ${{ runner.os }}-pip-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit vulnerability scan
        run: pip-audit --desc -r requirements.txt
        continue-on-error: true
