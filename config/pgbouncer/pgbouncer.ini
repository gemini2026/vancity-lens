; ─────────────────────────────────────────────────────────────────────────────
; PgBouncer Configuration for VanCity Lens (VCL-91 / PERF-014)
; Connection pooling proxy for PostgreSQL 16 with PostGIS
; ─────────────────────────────────────────────────────────────────────────────

; ─── Databases Section ────────────────────────────────────────────────────
; Map database aliases to backend connection strings
[databases]
vancity_lens = host=db port=5432 dbname=vancity_lens

; ─── Global Settings ─────────────────────────────────────────────────────
[pgbouncer]
; Admin interface settings
admin_users = vancity
stats_users = vancity

; ─── Connection Pool Settings ─────────────────────────────────────────────
; Pool mode: transaction (each transaction uses a separate connection)
pool_mode = transaction

; Maximum number of client connections to accept
max_client_conn = 200

; Number of backend connections per database (target size)
default_pool_size = 25

; Minimum number of connections to maintain per database
min_pool_size = 5

; Number of additional connections to reserve for new clients
reserve_pool_size = 5

; Timeout for acquiring a reserved connection (seconds)
reserve_pool_timeout = 3

; ─── Connection Lifecycle Settings ───────────────────────────────────────
; Maximum time a connection can be reused (seconds, 0 = unlimited)
server_lifetime = 3600

; Idle timeout before closing server connection (seconds)
server_idle_timeout = 600

; Connection check query before sending to client
server_check_query = "SELECT 1"

; ─── Logging & Monitoring ────────────────────────────────────────────────
; Log client connection events
log_connections = 1

; Log client disconnection events
log_disconnections = 1

; Log notice messages
log_pooler_errors = 1

; Statistics update period (seconds)
stats_period = 60

; ─── Performance & Tuning Settings ───────────────────────────────────────
; TCP keep-alive settings for long-lived connections
tcp_keepalives = 1
tcp_keepidles = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

; Enable query result pipelining
pkt_buf = 4096

; Verbose output to logs
verbose = 1

; ─── Authentication & Security ───────────────────────────────────────────
; Authentication type: md5 (standard for PostgreSQL)
auth_type = md5

; Path to authentication file
auth_file = /etc/pgbouncer/userlist.txt

; ─── Advanced Settings ───────────────────────────────────────────────────
; Maximum time a client can hold an idle connection (seconds)
idle_in_transaction_session_timeout = 900

; Disable query cancellation
cancel_wait_timeout = 0

; Server-side prepare statement caching
; (set to 0 to disable when using transaction pooling)
max_db_connections = 0

; ─── Connection String Options ───────────────────────────────────────────
; Application name for connections
application_name = pgbouncer
