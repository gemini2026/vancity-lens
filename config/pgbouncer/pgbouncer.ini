; PgBouncer Configuration for VanCity Lens (VCL-91 / PERF-014)

[databases]
vancity_lens = host=db port=5432 dbname=vancity_lens

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Admin
admin_users = vancity
stats_users = vancity

; Pool settings
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Connection lifecycle
server_lifetime = 3600
server_idle_timeout = 600
server_check_query = SELECT 1
server_check_delay = 30

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

; Buffer size
pkt_buf = 4096
