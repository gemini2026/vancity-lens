apiVersion: apps/v1
kind: Deployment
metadata:
  name: vancity-lens-frontend
  namespace: vancity-lens
  labels:
    app: vancity-lens-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vancity-lens-frontend
  template:
    metadata:
      labels:
        app: vancity-lens-frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens-docker/vancity-lens-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

