apiVersion: v1
kind: Service
metadata:
  name: vancity-lens-api
  namespace: vancity-lens
  labels:
    app: vancity-lens-api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: vancity-lens-api
