apiVersion: v1
kind: Service
metadata:
  name: vancity-lens-frontend
  namespace: vancity-lens
  labels:
    app: vancity-lens-frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: vancity-lens-frontend

