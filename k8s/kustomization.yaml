apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vancity-lens

# List of all resource files
resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- cronjob.yaml

# Common labels applied to all resources
commonLabels:
  app: vancity-lens
  managed-by: kustomize

# Common annotations applied to all resources
commonAnnotations:
  description: "VanCity Lens - Real Estate Intelligence Platform"
  project: "vancity-lens"

# Image replacement for deployment and cronjob
# Usage: kustomize build . | sed 's|REGISTRY|us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens|g' | sed 's|TAG|v1.0.0|g'
# Or use imageTag/imageName in images section
images:
- name: REGISTRY/vancity-lens-api
  newName: us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens/vancity-lens-api
  newTag: "latest"
