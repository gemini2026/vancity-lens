apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vancity-lens-api
  namespace: vancity-lens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vancity-lens-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
