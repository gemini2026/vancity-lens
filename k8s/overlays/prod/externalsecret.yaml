apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vancity-lens-secrets
  namespace: vancity-lens
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: vancity-lens-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: anthropic-api-key
      remoteRef:
        key: anthropic-api-key
    - secretKey: cohere-api-key
      remoteRef:
        key: cohere-api-key
    - secretKey: k2-api-key
      remoteRef:
        key: k2-api-key
    - secretKey: brave-search-api-key
      remoteRef:
        key: brave-search-api-key
    - secretKey: admin-api-key
      remoteRef:
        key: admin-api-key
