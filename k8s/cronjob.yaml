apiVersion: batch/v1
kind: CronJob
metadata:
  name: vancity-lens-daily-scrape
  namespace: vancity-lens
  labels:
    app: vancity-lens-api
spec:
  # Schedule: 6 AM UTC daily
  schedule: "0 6 * * *"
  
  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  # Suspend the job if needed
  suspend: false
  
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: vancity-lens-scraper
        spec:
          serviceAccountName: default
          restartPolicy: OnFailure
          
          containers:
          - name: scraper
            image: us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens/vancity-lens-api:latest
            imagePullPolicy: Always
            
            command:
            - python
            - scripts/seed_data.py
            - --scrape-only
            - --source
            - all
            - --days-back
            - "3"
            
            # Resource requests and limits
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            
            # Environment variables from ConfigMap and Secrets
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vancity-lens-secrets
                  key: database-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vancity-lens-secrets
                  key: anthropic-api-key
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vancity-lens-secrets
                  key: cohere-api-key
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: vancity-lens-config
                  key: cors-origins
