apiVersion: v1
kind: Secret
metadata:
  name: vancity-lens-secrets
  namespace: vancity-lens
  labels:
    app: vancity-lens-api
type: Opaque
stringData:
  database-url: "postgresql://user@localhost:5432/vancity_lens"  # No password — Cloud SQL Auth Proxy handles IAM auth
  anthropic-api-key: "your-anthropic-api-key"
  cohere-api-key: "your-cohere-api-key"
  k2-api-key: "your-k2-api-key"
  brave-search-api-key: "" # Optional; enables discover.type=web_search
  jwt-secret: "change-me-in-production"
  rapidapi-key: "" # Optional; enables /api/v1/admin/scrape-realtor
  tavily-api-key: "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"
