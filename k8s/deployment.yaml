apiVersion: apps/v1
kind: Deployment
metadata:
  name: vancity-lens-api
  namespace: vancity-lens
  labels:
    app: vancity-lens-api
    version: v1
spec:
  replicas: 1  # POC deployment, scale up in production
  selector:
    matchLabels:
      app: vancity-lens-api
  template:
    metadata:
      labels:
        app: vancity-lens-api
        version: v1
    spec:
      containers:
      - name: api
        image: us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens/vancity-lens-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        
        # Resource requests and limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe - restart container if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Environment variables from ConfigMap and Secrets
        env:
        - name: RAG_BACKEND
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: rag-backend
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: database-url
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: anthropic-api-key
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: cohere-api-key
        - name: K2_API_HOST
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-api-host
        - name: K2_CORPUS_ID
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-corpus-id
        - name: K2_TOP_K
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-top-k
        - name: K2_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-timeout-seconds
        - name: K2_FALLBACK_TO_LOCAL
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-fallback-to-local
        - name: K2_API_KEY
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: k2-api-key
        - name: K2_SHADOW_VALIDATE
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate
        - name: K2_SHADOW_VALIDATE_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate-sample-rate
        - name: K2_SHADOW_VALIDATE_LOCAL_MODE
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate-local-mode
        - name: K2_SHADOW_VALIDATE_TOP_N
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate-top-n
        - name: K2_SHADOW_VALIDATE_MAX_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate-max-concurrency
        - name: K2_SHADOW_VALIDATE_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: k2-shadow-validate-timeout-seconds
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: brave-search-api-key
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: vancity-lens-config
              key: cors-origins
