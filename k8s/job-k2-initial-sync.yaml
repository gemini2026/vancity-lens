apiVersion: batch/v1
kind: Job
metadata:
  name: k2-initial-sync
  namespace: vancity-lens
  labels:
    app: vancity-lens-api
    component: k2-sync
    purpose: initial-bulk-upload
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800  # 30 min max for initial bulk upload
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: vancity-lens-k2-sync
        purpose: initial-bulk-upload
    spec:
      serviceAccountName: vancity-lens-api
      terminationGracePeriodSeconds: 60
      restartPolicy: OnFailure

      containers:
      - name: k2-sync
        image: us-west1-docker.pkg.dev/openclaw-antonmishel-03460/vancity-lens-docker/vancity-lens-api:latest
        imagePullPolicy: Always

        command:
        - python
        - -m
        - api.intelligence.k2_sync
        - --force  # Force re-sync all documents on initial run

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: database-url
        - name: K2_API_HOST
          value: "https://api-dev.knowledge2.ai"
        - name: K2_API_KEY
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: k2-api-key
        - name: K2_CORPUS_ID
          valueFrom:
            secretKeyRef:
              name: vancity-lens-secrets
              key: k2-corpus-id

      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
        args:
          - "openclaw-antonmishel-03460:us-west1:vancity-lens-db"
          - "--private-ip"
          - "--auto-iam-authn"
          - "--port=5432"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
